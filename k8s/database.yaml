apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: romm-db
  namespace: romm
spec:
  serviceName: romm-db
  replicas: 1
  selector:
    matchLabels:
      app: romm-db
  template:
    metadata:
      labels:
        app: romm-db
    spec:
      containers:
      - name: mariadb
        image: mariadb:11.3.2
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MARIADB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: romm-config
              key: DB_NAME
        - name: MARIADB_USER
          valueFrom:
            configMapKeyRef:
              name: romm-config
              key: DB_USER
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: romm-secrets
              key: DB_PASSWD
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: romm-secrets
              key: DB_ROOT_PASSWD
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - mariadb-admin ping -h localhost -u root -p${MARIADB_ROOT_PASSWORD}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - mariadb-admin ping -h localhost -u root -p${MARIADB_ROOT_PASSWORD}
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: romm-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: romm-db
  namespace: romm
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: 3306
    protocol: TCP
    name: mysql
  selector:
    app: romm-db
